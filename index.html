<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portafolio de Fernando Joel Bonilla — Ingeniero de Software. Desarrollo full-stack, microservicios, IA y aplicaciones móviles."
    />
    <meta name="author" content="Fernando Joel Bonilla Guerrero" />
    <meta name="theme-color" content="#2C2C2A" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Joel Bonilla — Ingeniero de Software" />
    <meta
      property="og:description"
      content="Portafolio de proyectos: full-stack, microservicios, IA y móvil."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Joel Bonilla — Ingeniero de Software</title>
  </head>
  <body>
    <!-- Apply theme before paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
