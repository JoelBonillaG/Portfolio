  <body>
    <!-- Apply theme before paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          document.documentElement.classList.toggle('dark', stored !== 'light')
        } catch (e) {}
      })()
    </script>

  </body>
